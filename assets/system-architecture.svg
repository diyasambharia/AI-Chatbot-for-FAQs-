<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%" style="background:#0b0f19; font-family:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151d30" />
      <stop offset="100%" stop-color="#101726" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title & Header -->
  <text x="500" y="45" fill="#f8fafc" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="0.5">AI FAQ Chatbot - Retrieval-Augmented Architecture</text>
  <text x="500" y="72" fill="#94a3b8" font-size="13" text-anchor="middle">How document chunking, TF-IDF vectorization, and cosine similarity power instant answers</text>

  <!-- Section 1: Ingestion Pipeline -->
  <g transform="translate(60, 110)">
    <!-- Box -->
    <rect width="260" height="380" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" />
    <rect width="260" height="42" rx="14" fill="#1e293b" />
    <text x="130" y="27" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">1. DOCUMENT INGESTION</text>

    <!-- Content Items -->
    <g transform="translate(20, 60)">
      <!-- Item 1 -->
      <rect width="220" height="52" rx="8" fill="#1c253b" stroke="#334155" stroke-width="1"/>
      <text x="15" y="24" fill="#f8fafc" font-size="12" font-weight="600">Knowledge Sources</text>
      <text x="15" y="40" fill="#94a3b8" font-size="10">.txt, .md, .json FAQ files</text>

      <!-- Arrow Down -->
      <path d="M 110 57 L 110 75" stroke="#4f46e5" stroke-width="2" stroke-dasharray="3,3" />

      <!-- Item 2 -->
      <g transform="translate(0, 78)">
        <rect width="220" height="52" rx="8" fill="#1c253b" stroke="#334155" stroke-width="1"/>
        <text x="15" y="24" fill="#f8fafc" font-size="12" font-weight="600">Smart Chunking</text>
        <text x="15" y="40" fill="#94a3b8" font-size="10">Regex Q&amp;A pattern splitting</text>
      </g>

      <!-- Arrow Down -->
      <path d="M 110 135 L 110 153" stroke="#4f46e5" stroke-width="2" stroke-dasharray="3,3" />

      <!-- Item 3 -->
      <g transform="translate(0, 156)">
        <rect width="220" height="52" rx="8" fill="#1c253b" stroke="#334155" stroke-width="1"/>
        <text x="15" y="24" fill="#f8fafc" font-size="12" font-weight="600">Text Normalization</text>
        <text x="15" y="40" fill="#94a3b8" font-size="10">Tokenization &amp; Stopword filter</text>
      </g>

      <!-- Arrow Down -->
      <path d="M 110 213 L 110 231" stroke="#4f46e5" stroke-width="2" stroke-dasharray="3,3" />

      <!-- Item 4 -->
      <g transform="translate(0, 234)">
        <rect width="220" height="52" rx="8" fill="#1c253b" stroke="#38bdf8" stroke-width="1.2"/>
        <text x="15" y="24" fill="#38bdf8" font-size="12" font-weight="600">Vector Index Store</text>
        <text x="15" y="40" fill="#94a3b8" font-size="10">TF-IDF weights &amp; Unit vectors</text>
      </g>
    </g>
  </g>

  <!-- Flow Connector 1 to 2 -->
  <path d="M 320 300 L 370 300" stroke="#4f46e5" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <polygon points="370,300 360,295 360,305" fill="#4f46e5" />

  <!-- Section 2: Retrieval & Matching -->
  <g transform="translate(370, 110)">
    <!-- Box -->
    <rect width="260" height="380" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" />
    <rect width="260" height="42" rx="14" fill="#1e293b" />
    <text x="130" y="27" fill="#a855f7" font-size="13" font-weight="700" text-anchor="middle">2. QUERY &amp; SEMANTIC MATCH</text>

    <!-- Content Items -->
    <g transform="translate(20, 60)">
      <!-- Item 1 -->
      <rect width="220" height="52" rx="8" fill="#1c253b" stroke="#334155" stroke-width="1"/>
      <text x="15" y="24" fill="#f8fafc" font-size="12" font-weight="600">User Query Input</text>
      <text x="15" y="40" fill="#94a3b8" font-size="10">Natural language question</text>

      <!-- Arrow Down -->
      <path d="M 110 57 L 110 75" stroke="#a855f7" stroke-width="2" stroke-dasharray="3,3" />

      <!-- Item 2 -->
      <g transform="translate(0, 78)">
        <rect width="220" height="52" rx="8" fill="#1c253b" stroke="#334155" stroke-width="1"/>
        <text x="15" y="24" fill="#f8fafc" font-size="12" font-weight="600">Query Vectorizer</text>
        <text x="15" y="40" fill="#94a3b8" font-size="10">Apply trained IDF weights</text>
      </g>

      <!-- Arrow Down -->
      <path d="M 110 135 L 110 153" stroke="#a855f7" stroke-width="2" stroke-dasharray="3,3" />

      <!-- Item 3 -->
      <g transform="translate(0, 156)">
        <rect width="220" height="52" rx="8" fill="#1c253b" stroke="#334155" stroke-width="1"/>
        <text x="15" y="24" fill="#f8fafc" font-size="12" font-weight="600">Cosine Similarity</text>
        <text x="15" y="40" fill="#94a3b8" font-size="10">Dot product with all chunks</text>
      </g>

      <!-- Arrow Down -->
      <path d="M 110 213 L 110 231" stroke="#a855f7" stroke-width="2" stroke-dasharray="3,3" />

      <!-- Item 4 -->
      <g transform="translate(0, 234)">
        <rect width="220" height="52" rx="8" fill="#1c253b" stroke="#a855f7" stroke-width="1.2"/>
        <text x="15" y="24" fill="#c084fc" font-size="12" font-weight="600">Question Overlap Boost</text>
        <text x="15" y="40" fill="#94a3b8" font-size="10">Title match score enhancement</text>
      </g>
    </g>
  </g>

  <!-- Flow Connector 2 to 3 -->
  <path d="M 630 300 L 680 300" stroke="#a855f7" stroke-width="3" fill="none" />
  <polygon points="680,300 670,295 670,305" fill="#a855f7" />

  <!-- Section 3: Response Generation & Citations -->
  <g transform="translate(680, 110)">
    <!-- Box -->
    <rect width="260" height="380" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" />
    <rect width="260" height="42" rx="14" fill="#1e293b" />
    <text x="130" y="27" fill="#10b981" font-size="13" font-weight="700" text-anchor="middle">3. ANSWER &amp; CITATIONS</text>

    <!-- Content Items -->
    <g transform="translate(20, 60)">
      <!-- Item 1 -->
      <rect width="220" height="52" rx="8" fill="#1c253b" stroke="#334155" stroke-width="1"/>
      <text x="15" y="24" fill="#f8fafc" font-size="12" font-weight="600">Top-K Ranked Result</text>
      <text x="15" y="40" fill="#94a3b8" font-size="10">Highest similarity chunk</text>

      <!-- Arrow Down -->
      <path d="M 110 57 L 110 75" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3" />

      <!-- Item 2 -->
      <g transform="translate(0, 78)">
        <rect width="220" height="52" rx="8" fill="#1c253b" stroke="#334155" stroke-width="1"/>
        <text x="15" y="24" fill="#f8fafc" font-size="12" font-weight="600">Confidence Scoring</text>
        <text x="15" y="40" fill="#10b981" font-size="10">0% - 99% accuracy index</text>
      </g>

      <!-- Arrow Down -->
      <path d="M 110 135 L 110 153" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3" />

      <!-- Item 3 -->
      <g transform="translate(0, 156)">
        <rect width="220" height="52" rx="8" fill="#1c253b" stroke="#334155" stroke-width="1"/>
        <text x="15" y="24" fill="#f8fafc" font-size="12" font-weight="600">Source Document Link</text>
        <text x="15" y="40" fill="#94a3b8" font-size="10">Auditable file provenance</text>
      </g>

      <!-- Arrow Down -->
      <path d="M 110 213 L 110 231" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3" />

      <!-- Item 4 -->
      <g transform="translate(0, 234)">
        <rect width="220" height="52" rx="8" fill="#1c253b" stroke="#10b981" stroke-width="1.2"/>
        <text x="15" y="24" fill="#34d399" font-size="12" font-weight="600">Related Topic Chips</text>
        <text x="15" y="40" fill="#94a3b8" font-size="10">Proactive follow-up queries</text>
      </g>
    </g>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(180, 515)">
    <rect width="180" height="28" rx="14" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1" />
    <text x="90" y="18" fill="#a5b4fc" font-size="11" font-weight="600" text-anchor="middle">⚡ Sub-millisecond Search</text>
  </g>
  <g transform="translate(410, 515)">
    <rect width="180" height="28" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="90" y="18" fill="#6ee7b7" font-size="11" font-weight="600" text-anchor="middle">🔒 100% Private &amp; Local</text>
  </g>
  <g transform="translate(640, 515)">
    <rect width="180" height="28" rx="14" fill="#1e293b" stroke="#64748b" stroke-width="1" />
    <text x="90" y="18" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">💰 Zero API Costs</text>
  </g>
</svg>
