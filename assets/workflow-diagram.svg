<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#0b0f19; font-family:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <text x="480" y="42" fill="#f8fafc" font-size="22" font-weight="700" text-anchor="middle">FAQ Chatbot Execution Lifecycle</text>
  <text x="480" y="66" fill="#94a3b8" font-size="12" text-anchor="middle">Dual-channel pipeline: Document Indexing (offline/upload) &amp; Query Retrieval (real-time)</text>

  <!-- Track 1: Document Indexing Pipeline -->
  <g transform="translate(40, 105)">
    <!-- Track Title -->
    <rect width="180" height="26" rx="6" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1" />
    <text x="90" y="17" fill="#a5b4fc" font-size="10.5" font-weight="700" text-anchor="middle">CHANNEL A: INDEXING</text>

    <!-- Steps -->
    <g transform="translate(0, 42)">
      <!-- Step 1 -->
      <rect width="190" height="60" rx="10" fill="#151d30" stroke="#334155" stroke-width="1" />
      <text x="18" y="26" fill="#38bdf8" font-size="12" font-weight="700">FAQ Documents</text>
      <text x="18" y="44" fill="#94a3b8" font-size="10">Markdown / Text files</text>

      <!-- Arrow -->
      <line x1="190" y1="30" x2="230" y2="30" stroke="#64748b" stroke-width="2" marker-end="url(#arr)" />

      <!-- Step 2 -->
      <g transform="translate(230, 0)">
        <rect width="190" height="60" rx="10" fill="#151d30" stroke="#334155" stroke-width="1" />
        <text x="18" y="26" fill="#f8fafc" font-size="12" font-weight="700">Regex Chunking</text>
        <text x="18" y="44" fill="#94a3b8" font-size="10">Split into Q&amp;A units</text>
      </g>

      <!-- Arrow -->
      <line x1="420" y1="30" x2="460" y2="30" stroke="#64748b" stroke-width="2" marker-end="url(#arr)" />

      <!-- Step 3 -->
      <g transform="translate(460, 0)">
        <rect width="190" height="60" rx="10" fill="#151d30" stroke="#334155" stroke-width="1" />
        <text x="18" y="26" fill="#f8fafc" font-size="12" font-weight="700">IDF Frequency</text>
        <text x="18" y="44" fill="#94a3b8" font-size="10">Calculate term rarities</text>
      </g>

      <!-- Arrow -->
      <line x1="650" y1="30" x2="690" y2="30" stroke="#64748b" stroke-width="2" marker-end="url(#arr)" />

      <!-- Step 4 -->
      <g transform="translate(690, 0)">
        <rect width="190" height="60" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
        <text x="18" y="26" fill="#c7d2fe" font-size="12" font-weight="700">Indexed Vectors</text>
        <text x="18" y="44" fill="#94a3b8" font-size="10">Normalized unit vectors</text>
      </g>
    </g>
  </g>

  <!-- Track 2: Real-Time Query Retrieval -->
  <g transform="translate(40, 275)">
    <!-- Track Title -->
    <rect width="180" height="26" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1" />
    <text x="90" y="17" fill="#6ee7b7" font-size="10.5" font-weight="700" text-anchor="middle">CHANNEL B: RETRIEVAL</text>

    <!-- Steps -->
    <g transform="translate(0, 42)">
      <!-- Step 1 -->
      <rect width="190" height="60" rx="10" fill="#151d30" stroke="#334155" stroke-width="1" />
      <text x="18" y="26" fill="#34d399" font-size="12" font-weight="700">User Question</text>
      <text x="18" y="44" fill="#94a3b8" font-size="10">Natural language input</text>

      <!-- Arrow -->
      <line x1="190" y1="30" x2="230" y2="30" stroke="#64748b" stroke-width="2" marker-end="url(#arr)" />

      <!-- Step 2 -->
      <g transform="translate(230, 0)">
        <rect width="190" height="60" rx="10" fill="#151d30" stroke="#334155" stroke-width="1" />
        <text x="18" y="26" fill="#f8fafc" font-size="12" font-weight="700">Query Vectorizer</text>
        <text x="18" y="44" fill="#94a3b8" font-size="10">Tokenize &amp; apply IDF</text>
      </g>

      <!-- Arrow -->
      <line x1="420" y1="30" x2="460" y2="30" stroke="#64748b" stroke-width="2" marker-end="url(#arr)" />

      <!-- Step 3 -->
      <g transform="translate(460, 0)">
        <rect width="190" height="60" rx="10" fill="#151d30" stroke="#334155" stroke-width="1" />
        <text x="18" y="26" fill="#f8fafc" font-size="12" font-weight="700">Cosine Dot-Product</text>
        <text x="18" y="44" fill="#94a3b8" font-size="10">Rank against vector store</text>
      </g>

      <!-- Arrow -->
      <line x1="650" y1="30" x2="690" y2="30" stroke="#64748b" stroke-width="2" marker-end="url(#arr)" />

      <!-- Step 4 -->
      <g transform="translate(690, 0)">
        <rect width="190" height="60" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.2" />
        <text x="18" y="26" fill="#a7f3d0" font-size="12" font-weight="700">Answer + Citations</text>
        <text x="18" y="44" fill="#94a3b8" font-size="10">Confidence score % &amp; file</text>
      </g>
    </g>
  </g>

  <!-- Connective bridge between Index and Cosine Similarity -->
  <path d="M 785 207 L 785 240 L 555 240 L 555 315" stroke="#4f46e5" stroke-width="1.8" stroke-dasharray="4,4" fill="none" marker-end="url(#arr)" />
  <rect x="620" y="230" width="130" height="20" rx="4" fill="#0b0f19" stroke="#4f46e5" stroke-width="0.8" />
  <text x="685" y="244" fill="#a5b4fc" font-size="9.5" text-anchor="middle">Feed Vectors to Matcher</text>
</svg>
